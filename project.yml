name: Anvil

options:
  bundleIdPrefix: com.mashoaib
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true

configFiles:
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "22"
    CODE_SIGN_STYLE: Manual
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  LauncherKit:
    path: LauncherKit
  WindowKit:
    path: WindowKit
  RulesKit:
    path: RulesKit
  MouseKit:
    path: MouseKit
  CleanerKit:
    path: CleanerKit
  ClaudeKit:
    path: ClaudeKit
  ShellKit:
    path: ShellKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1

targets:
  Anvil-macOS:
    type: application
    platform: macOS
    sources:
      - macOS
      - Icon/AppIcon.icon
    dependencies:
      - package: LauncherKit
      - package: WindowKit
      - package: RulesKit
      - package: MouseKit
      - package: CleanerKit
      - package: ClaudeKit
      - package: ShellKit
      - package: Sparkle
    info:
      path: macOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://$(ANVIL_UPDATES_HOST)/anvil/appcast.xml
        SUPublicEDKey: $(ANVIL_SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_NAME: Anvil
        PRODUCT_BUNDLE_IDENTIFIER: com.mashoaib.anvil
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Anvil
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Anvil asks Finder to move apps from the Mac App Store to the Trash because only Finder can ask for your password to do it.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Anvil reads the battery levels of your AirPods to show them in the search bar.
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
      configs:
        Release:
          CODE_SIGN_IDENTITY: Developer ID Application
